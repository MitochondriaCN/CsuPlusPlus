product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.material3.adaptive.navigation.suite
  - $libs.material3.adaptive
  - $libs.material3.adaptive.layout
  - $libs.material3.adaptive.navigation
  - $libs.icons.lucide.cmp
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.ksafe
  - $libs.filekit.dialogs.compose
  - $ktor.client.core
  - $ktor.client.contentNegotiation
  - $ktor.serialization.kotlinx.json
  - $ktor.client.logging
  - $kotlin.serialization.json
  - io.ktor:ktor-client-engine-defaults

dependencies@android:
  - $compose.uiTooling

settings:
  kotlin:
    serialization: enabled
  ktor:
    enabled: true
  compose:
    enabled: true
    resources:
      packageName: ink.qingshuige.csuplusplus.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
